services:
  - type: web
    name: cipher-lld-studio
    env: node
    plan: free
    buildCommand: "npm install --include=dev && npm --prefix backend install --include=dev && npm --prefix frontend install --include=dev && npm run build"
    startCommand: "node backend/dist/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cipher-lld-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: cipher-lld-db
    plan: free
    databaseName: cipher_lld_db
    user: cipher_admin
